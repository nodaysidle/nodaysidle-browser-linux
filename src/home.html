<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nodaysidle</title>
  <style>
    :root {
      --bg: #090A0C; --surface: #14171A; --line: #1E293B; --text: #94A3B8;
      --strong: #F8FAFC; --muted: #64748B; --accent: #CBD5E1; --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--strong);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--strong);
    }
    .search-box {
      width: 100%;
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 22px;
      font-size: 15px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--strong);
      outline: none;
      transition: all 0.2s ease;
      
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">nodaysidle</div>

    <form class="search-box" action="https://duckduckgo.com/" method="get">
      <input type="text" name="q" class="search-input" placeholder="Search the web or type a URL..." autofocus autocomplete="off">
    </form>
  </div>
</body>
</html>
