<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nodaysidle</title>
  <style>
    :root {
      --bg: #090A0C; --surface: #14171A; --line: #1E293B; --text: #94A3B8;
      --strong: #F8FAFC; --muted: #64748B; --accent: #CBD5E1; --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--strong);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      width: 100%;
      max-width: 640px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--strong);
    }
    .search-box {
      width: 100%;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 15px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--strong);
      outline: none;
      transition: all 0.2s ease;
      
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      gap: 10px;
    }
    .tile:hover {
      border-color: var(--accent);
      color: var(--strong);
      transform: translateY(-2px);
    }
    .tile-badge {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">nodaysidle</div>

    <form class="search-box" action="https://duckduckgo.com/" method="get">
      <input type="text" name="q" class="search-input" placeholder="Search the web or type a URL..." autofocus autocomplete="off">
    </form>

    <div class="tiles">
      <a href="https://gemini.google.com" class="tile">
        <div class="tile-badge">GM</div>
        <div>Gemini</div>
      </a>
      <a href="https://google.com" class="tile">
        <div class="tile-badge">G</div>
        <div>Google</div>
      </a>
      <a href="https://github.com" class="tile">
        <div class="tile-badge">GH</div>
        <div>GitHub</div>
      </a>
      <a href="https://youtube.com" class="tile">
        <div class="tile-badge">YT</div>
        <div>YouTube</div>
      </a>
    </div>
  </div>
</body>
</html>
