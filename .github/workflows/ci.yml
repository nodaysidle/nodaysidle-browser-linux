name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 3 / WebKitGTK 4.1 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libatk1.0-dev pkg-config \
            xvfb dbus-x11 at-spi2-core desktop-file-utils \
            bubblewrap xdg-dbus-proxy
      # WebKitGTK's sandbox (bwrap) needs unprivileged user namespaces, which
      # Ubuntu 24.04 blocks via AppArmor by default.
      - name: Allow unprivileged user namespaces for the WebKit sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # GTK/WebKit tests need a display; NODAYSIDLE_REQUIRE_DISPLAY makes a
      # missing display fail the run instead of silently skipping those tests.
      - run: xvfb-run -a env NODAYSIDLE_REQUIRE_DISPLAY=1 cargo test --locked --release
      - run: desktop-file-validate desktop/com.nodaysidle.Browser.desktop
      - run: bash -n scripts/*.sh
