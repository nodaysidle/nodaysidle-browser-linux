name: Bundled AppImage (test build, not a release)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  bundled-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config dpkg-dev patchelf file \
            librsvg2-common gsettings-desktop-schemas glib-networking \
            desktop-file-utils squashfs-tools libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build slim binary
        run: cargo build --release --locked
      - name: Package bundled AppImage (linuxdeploy + linuxdeploy-plugin-gtk)
        run: ./scripts/package-appimage-bundled.sh
      - name: Size and checksum
        run: |
          cd dist
          stat -c '%n %s bytes' nodaysidle-browser-bundled-x86_64.AppImage
          sha256sum nodaysidle-browser-bundled-x86_64.AppImage | tee nodaysidle-browser-bundled-x86_64.AppImage.sha256
      - name: Test-run in clean debian:bookworm-slim (no WebKitGTK/GTK) under xvfb
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xauth ca-certificates procps >/dev/null
            if dpkg -l | grep -E "webkit2gtk|libgtk-3"; then echo "image is not clean" >&2; exit 1; fi
            cd /tmp && /dist/nodaysidle-browser-bundled-x86_64.AppImage --appimage-extract >/dev/null
            # WebKit needs bwrap for its sandbox; the clean image has none, so this run disables it.
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 HOME=/tmp/home
            mkdir -p "$HOME"
            set +e
            timeout 25 xvfb-run -a /tmp/squashfs-root/AppRun "data:text/html,<title>ok</title>ok" > /tmp/run.log 2>&1
            rc=$?
            set -e
            cat /tmp/run.log
            if grep -Ei "error while loading shared libraries|cannot open shared object|Unable to spawn" /tmp/run.log; then exit 1; fi
            # 124 = still running when the timeout hit, i.e. the window stayed up.
            [ "$rc" = 124 ] || { echo "unexpected exit $rc" >&2; exit 1; }
          '
      - name: appimagelint
        continue-on-error: true
        run: |
          curl -L -s -f -o appimagelint https://github.com/TheAssassin/appimagelint/releases/download/continuous/appimagelint-x86_64.AppImage
          chmod +x appimagelint
          ./appimagelint --appimage-extract-and-run dist/nodaysidle-browser-bundled-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: nodaysidle-browser-bundled-x86_64
          path: |
            dist/nodaysidle-browser-bundled-x86_64.AppImage
            dist/nodaysidle-browser-bundled-x86_64.AppImage.sha256
          if-no-files-found: error
