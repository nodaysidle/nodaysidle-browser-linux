[package]
name = "nodaysidle-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Quiet WebKit browser for Linux (nodaysidle)"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
gio = "0.18"
glib = "0.18"
gdk = "0.18"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idna = "1"
url = "2"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
